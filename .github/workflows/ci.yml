name: CI

# The data set is 256 kB and versioned with the repository, so CI runs the
# entire pipeline on the real data rather than on fixtures. A pipeline that is
# only ever exercised by unit tests is one that breaks the first time somebody
# runs it end to end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and full pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report environment
        run: |
          python -c "import numpy, scipy, matplotlib; \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('matplotlib', matplotlib.__version__)"

      - name: Run test suite
        run: python -m pytest tests/ -v

      # The quality gate runs on its own so that a change in the data shows up
      # as its own failure rather than buried inside the pipeline step.
      - name: Data quality gate
        run: python scripts/01_validation.py

      - name: Run the full pipeline
        run: |
          python scripts/00_ingest.py
          python scripts/01_validation.py
          python scripts/02_rates.py
          python scripts/03_timeseries.py
          python scripts/04_normalization.py
          python scripts/05_fits.py
          python scripts/06_systematics.py
          python scripts/90_report_figures.py

      # The versioned results were produced on a developer machine. If a fresh
      # run on a clean runner disagrees with them beyond floating-point noise,
      # the published numbers are not reproducible and that has to fail loudly.
      - name: Check the published results are reproducible
        run: python scripts/check_reproducibility.py

      - name: Upload the products of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-python-${{ matrix.python-version }}
          path: results/
          retention-days: 14
